name: Deploy to DreamHost

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via rsync over SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude=".git*" --exclude=".github"
          path: ./
          remote_path: ${{ secrets.DREAMHOST_PATH }}
          remote_host: ${{ secrets.DREAMHOST_HOST }}
          remote_port: ${{ secrets.DREAMHOST_PORT }}
          remote_user: ${{ secrets.DREAMHOST_USER }}
          remote_key: ${{ secrets.DREAMHOST_SSH_KEY }}
